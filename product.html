<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Backlog</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Product Backlog</h1>
        <nav>
            <a href="landing.html">Home</a>
            <a href="idea.html">View Idea Backlog</a>
            <a href="product.html">View Product Backlog</a>
            <a href="sprint.html">View Sprint</a>

        </nav>
    </header>

    <section>
        <h2>Manage prioritized features in the product backlog.</h2>
        <p>Features moved here from the idea backlog can be prepared for sprints.</p>
    </section>

    <section class="container">
        <table>
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Description</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="product-backlog-table-body">
                <!-- Product Backlog Rows will be dynamically loaded here -->
            </tbody>
        </table>
    </section>

    <footer>
        <p>&copy; 2025 Product Backlog. All Rights Reserved.</p>
    </footer>

    <script>
        // Function to render the product backlog
        function renderProductBacklog() {
            const productBacklog = JSON.parse(localStorage.getItem('productBacklog')) || [];
            const productTableBody = document.getElementById('product-backlog-table-body');

            productTableBody.innerHTML = ''; // Clear existing content

            productBacklog.forEach((item, index) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${item.title}</td>
                    <td>${item.description}</td>
                    <td>
                        <button onclick="promoteToSprint(${index})">Promote to Sprint</button>
                    </td>
                `;
                productTableBody.appendChild(row);
            });
        }

        // Function to promote a feature to the sprint backlog
        function promoteToSprint(index) {
            const productBacklog = JSON.parse(localStorage.getItem('productBacklog')) || [];
            const sprintBacklog = JSON.parse(localStorage.getItem('sprintBacklog')) || [];

            const [promotedItem] = productBacklog.splice(index, 1);
            sprintBacklog.push({
                ...promotedItem,
                userStory: '',
                techStack: 'Front End', // Default
                acceptanceCriteria: '',
                userStoryType: '',
                assignee: 'Unassigned',
                status: 'Incomplete' // Default
            });

            localStorage.setItem('productBacklog', JSON.stringify(productBacklog));
            localStorage.setItem('sprintBacklog', JSON.stringify(sprintBacklog));
            renderProductBacklog();
            alert(`${promotedItem.title} has been moved to the Sprint Backlog.`);
        }

        // Render the product backlog on page load
        document.addEventListener('DOMContentLoaded', renderProductBacklog);
    </script>
</body>
</html>
