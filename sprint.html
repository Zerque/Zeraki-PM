<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprint Backlog</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Sprint Backlog</h1>
        <nav>
            <a href="landing.html">Home</a>
            <a href="idea.html">View Idea Backlog</a>
            <a href="product.html">View Product Backlog</a>
            <a href="sprint.html">View Sprint</a>
        </nav>
    </header>

    <section>
        <h2>Manage Sprint Backlog</h2>
        <p>Update details for each feature and track their progress.</p>
    </section>

    <section class="sprint-container">
        <table>
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Description</th>
                    <th>User Story</th>
                    <th>Tech Stack</th>
                    <th>Acceptance Criteria</th>
                    <th>User Story Type</th>
                    <th>Assignee</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="sprint-backlog-table-body">
                <!-- Sprint Backlog Rows will be dynamically loaded here -->
            </tbody>
        </table>
    </section>

    <footer>
        <p>&copy; 2025 Sprint Backlog. All Rights Reserved.</p>
    </footer>

    <script>
        // Render the Sprint Backlog
        function renderSprintBacklog() {
            const sprintBacklog = JSON.parse(localStorage.getItem('sprintBacklog')) || [];
            const sprintTableBody = document.getElementById('sprint-backlog-table-body');

            sprintTableBody.innerHTML = ''; // Clear existing rows

            sprintBacklog.forEach((item, index) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${item.title}</td>
                    <td>${item.description}</td>
                    <td><textarea onchange="updateSprintField(${index}, 'userStory', this.value)">${item.userStory || ''}</textarea></td>
                    <td>
                        <select onchange="updateSprintField(${index}, 'techStack', this.value)">
                            <option value="Front End" ${item.techStack === 'Front End' ? 'selected' : ''}>Front End</option>
                            <option value="Back End" ${item.techStack === 'Back End' ? 'selected' : ''}>Back End</option>
                        </select>
                    </td>
                    <td><textarea onchange="updateSprintField(${index}, 'acceptanceCriteria', this.value)">${item.acceptanceCriteria || ''}</textarea></td>
                    <td><textarea onchange="updateSprintField(${index}, 'userStoryType', this.value)">${item.userStoryType || ''}</textarea></td>
                    <td>
                        <select onchange="updateSprintField(${index}, 'assignee', this.value)">
                            <option value="Grace" ${item.assignee === 'Grace' ? 'selected' : ''}>Grace</option>
                            <option value="Stanley" ${item.assignee === 'Stanley' ? 'selected' : ''}>Stanley</option>
                            <option value="Kisavi" ${item.assignee === 'Kisavi' ? 'selected' : ''}>Kisavi</option>
                            <option value="Sielei" ${item.assignee === 'Sielei' ? 'selected' : ''}>Sielei</option>
                            <option value="Said" ${item.assignee === 'Said' ? 'selected' : ''}>Said</option>
                        </select>
                    </td>
                    <td>
                        <select onchange="updateSprintField(${index}, 'status', this.value)">
                            <option value="Incomplete" ${item.status === 'Incomplete' ? 'selected' : ''}>Incomplete</option>
                            <option value="Done" ${item.status === 'Done' ? 'selected' : ''}>Done</option>
                        </select>
                    </td>
                    <td>
                        <button class="btn primary" onclick="saveSprintItem(${index})">Save</button>
                        <button class="btn danger" onclick="deleteSprintItem(${index})">Delete</button>
                    </td>
                `;
                sprintTableBody.appendChild(row);
            });
        }

        // Update fields in Sprint Backlog
        function updateSprintField(index, field, value) {
            const sprintBacklog = JSON.parse(localStorage.getItem('sprintBacklog')) || [];
            sprintBacklog[index][field] = value;
            localStorage.setItem('sprintBacklog', JSON.stringify(sprintBacklog));
        }

        // Save a single Sprint Item
        function saveSprintItem(index) {
            const sprintBacklog = JSON.parse(localStorage.getItem('sprintBacklog')) || [];
            const item = sprintBacklog[index];
            localStorage.setItem('sprintBacklog', JSON.stringify(sprintBacklog));
            alert(`Feature "${item.title}" has been saved successfully!`);
        }

        // Delete a Sprint Item
        function deleteSprintItem(index) {
            const sprintBacklog = JSON.parse(localStorage.getItem('sprintBacklog')) || [];
            const [deletedItem] = sprintBacklog.splice(index, 1);
            localStorage.setItem('sprintBacklog', JSON.stringify(sprintBacklog));
            renderSprintBacklog();
            alert(`Feature "${deletedItem.title}" has been deleted.`);
        }

        // Render Sprint Backlog on Page Load
        document.addEventListener('DOMContentLoaded', renderSprintBacklog);
    </script>
</body>
</html>
