<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Idea Backlog</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Idea Backlog</h1>
        <nav>
            <a href="landing.html">Back to Features</a>
            <a href="product.html">View Product Backlog</a>
        </nav>
    </header>

    <section>
        <h2>Vote and promote features from the idea backlog to the product backlog.</h2>
        <p>This page will display collected feedback from users. Vote on ideas to move them forward.</p>
    </section>

    <section class="container" id="feedback-list">
        <table>
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Description</th>
                    <th>Votes</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="feedback-table-body">
                <!-- Feedback Rows will be dynamically loaded here -->
            </tbody>
        </table>
    </section>

    <footer>
        <p>&copy; 2025 Idea Backlog. All Rights Reserved.</p>
    </footer>

    <script>
        // Sample feedback data (this would normally come from the backend)
        const feedbacks = [
            { id: 1, title: "Improve Search Functionality", description: "Users need better filtering options.", votes: 0 },
            { id: 2, title: "Add Dark Mode", description: "A dark mode option for the website is requested.", votes: 0 },
            { id: 3, title: "Faster Loading Times", description: "The app should load faster for a smoother user experience.", votes: 0 }
        ];

        // Voting function
        function vote(feedbackId, type) {
            const feedback = feedbacks.find(f => f.id === feedbackId);
            if (type === 'up') {
                feedback.votes++;
            } else if (type === 'down') {
                feedback.votes--;
            }

            // Update the vote count on the page
            document.getElementById(`votes-${feedback.id}`).innerText = feedback.votes;
        }

        // Move feedback to product backlog (handled via localStorage for demonstration)
        function moveToBacklog(feedbackId) {
            const feedbackIndex = feedbacks.findIndex(f => f.id === feedbackId);
            if (feedbackIndex !== -1) {
                const feedback = feedbacks.splice(feedbackIndex, 1)[0];

                // Retrieve existing backlog from localStorage or initialize a new array
                const productBacklog = JSON.parse(localStorage.getItem('productBacklog')) || [];
                productBacklog.push(feedback);
                localStorage.setItem('productBacklog', JSON.stringify(productBacklog));

                renderFeedback();
            }
        }

        // Function to render feedback table
        function renderFeedback() {
            const feedbackTableBody = document.getElementById('feedback-table-body');
            feedbackTableBody.innerHTML = ''; // Clear existing feedback rows

            feedbacks.forEach(feedback => {
                const feedbackRow = document.createElement('tr');

                feedbackRow.innerHTML = `
                    <td>${feedback.title}</td>
                    <td>${feedback.description}</td>
                    <td id="votes-${feedback.id}">${feedback.votes}</td>
                    <td>
                        <button onclick="vote(${feedback.id}, 'up')">Upvote</button>
                        <button onclick="vote(${feedback.id}, 'down')">Downvote</button>
                        <button onclick="moveToBacklog(${feedback.id})">Move to Product Backlog</button>
                    </td>
                `;

                feedbackTableBody.appendChild(feedbackRow);
            });
        }

        // Initial render of feedbacks
        renderFeedback();
    </script>
</body>
</html>
